name: Build Universal Windows App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Universal 32-bit App (Works on all Windows)
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2 for 32-bit
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW32
        install: mingw-w64-i686-gcc
        update: true

    - name: Compile Universal App
      shell: msys2 {0}
      run: |
        g++ -static -mwindows -std=c++17 main.cpp -o ExpenseApp.exe -lcomctl32 -lcomdlg32 -lshell32 -lgdi32 -lole32 -luuid

    - name: Upload Universal App
      uses: actions/upload-artifact@v4
      with:
        name: ExpenseApp-Universal
        path: ExpenseApp.exe
